[project]
name = "ai-henchmen"
version = "0.4.0"
description = "MCP server that hands work down from a big model: minions (one checked step on small, mostly local models) and agents (own steps, proposals only)."
requires-python = ">=3.10"
dependencies = ["mcp>=2.0", "httpx>=0.27", "jsonschema>=4.20",
                "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
ai-henchmen = "minions.server:main"
mcp-minions = "minions.server:main"   # old name, kept so existing client entries keep working
henchmen-agent = "agents.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minions", "agents"]
